services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papermind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_history
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/papermind
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PYTHONPATH=/app
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/cache:/app/data/cache
      - ./data/chroma:/app/data/chroma
      - ./data/exports:/app/data/exports
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python -c 'from papermind.storage.database import init_db; init_db()' &&
        uvicorn papermind.api.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    build: .
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/papermind
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PYTHONPATH=/app
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/cache:/app/data/cache
      - ./data/chroma:/app/data/chroma
      - ./data/exports:/app/data/exports
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python -m papermind.ingestion.background_worker
      "

  chainlit:
    build: .
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/papermind
      - CHAT_DATABASE_URL=postgresql://postgres:postgres@chat-db:5432/chat_history
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PYTHONPATH=/app
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/cache:/app/data/cache
      - ./data/chroma:/app/data/chroma
      - ./data/exports:/app/data/exports
    depends_on:
      db:
        condition: service_healthy
      chat-db:
        condition: service_healthy
    command: >
      sh -c "
        chainlit run papermind.ui.chainlit_app --host 0.0.0.0 --port 8001
      "

volumes:
  postgres_data:
  chat_db_data: